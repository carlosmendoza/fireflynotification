services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3001"
    environment:
      DATABASE_URL: postgres://${DB_USER:-apiuser}:${DB_PASSWORD:-apipass}@db:5432/${DB_NAME:-apidb}
      PORT: 3000
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-apiuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-apipass}
      POSTGRES_DB: ${DB_NAME:-apidb}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-apiuser} -d ${DB_NAME:-apidb}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  uploads_data:
